<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MCU 响应式验收</title><style>body{margin:20px;background:#262626;color:white;font:14px sans-serif}iframe{display:block;border:0;margin-top:15px;background:#101113;max-width:100%}button{padding:10px;margin-right:8px}</style><h1>实际页面 · 窄屏验收</h1><p>此页面仅供开发验收；内嵌页面使用真实 CSS 视口。</p><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="768">768px</button><iframe title="MCU 预览" src="../" width="390" height="844"></iframe><script>const frame=document.querySelector('iframe');function fit(w){const scrollbar=frame.contentWindow.innerWidth-frame.contentDocument.documentElement.clientWidth;frame.width=Number(w)+scrollbar;}frame.addEventListener('load',()=>fit(390));document.querySelectorAll('button').forEach(b=>b.onclick=()=>fit(b.dataset.width))</script></html>
